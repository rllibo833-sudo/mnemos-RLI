# The runner lives on main; it checks out Knowledge for canonical graph data.
# Keep this workflow on the default branch so schedule events remain eligible.
name: Deliver Supabase transport outbox to Mnemos Knowledge
on:
  repository_dispatch:
    types: [sync-supabase-to-knowledge]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-supabase-to-knowledge.yml
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
concurrency:
  group: mnemos-knowledge-outbox
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Knowledge
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save tsx
      - name: Test five-layer Knowledge contract
        run: npx tsx scripts/validate-knowledge-layers.test.ts
      - name: Import pending outbox events
        run: npx tsx scripts/sync-supabase-to-knowledge.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Validate canonical graph
        run: |
          npx tsx scripts/generate-manifest.ts
          node -e 'const m=require("./knowledge/manifest.json"); console.log("Validated Knowledge graph:",m.nodes_count,"nodes,",m.edges_count,"edges");'
      - name: Commit Knowledge snapshot
        id: commit
        run: |
          git config user.name "knowledge-sync[bot]"
          git config user.email "knowledge-sync[bot]@users.noreply.github.com"
          git add knowledge/nodes knowledge/edges knowledge/manifest.json
          git diff --cached --quiet || (git commit -m "sync: deliver transport events to Knowledge" && git push origin Knowledge)
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Acknowledge only after commit is present on origin
        run: npx tsx scripts/ack-supabase-outbox.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KNOWLEDGE_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
