name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional macOS event backend
        if: runner.os == 'macOS'
        run: python -m pip install 'watchdog>=4.0' 'pyobjc-framework-CoreServices>=10.0'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify package metadata
        run: python -m pip install --no-deps -e .
      - name: Smoke-test installed CLI against an isolated database
        shell: bash
        run: |
          DB_PATH="$RUNNER_TEMP/mnemos-smoke.sqlite3"
          mnemos --db "$DB_PATH" init
          mnemos --db "$DB_PATH" add "mnemos-cli-smoke-marker"
          mnemos --db "$DB_PATH" search "mnemos-cli-smoke-marker" | python -c "import json, sys; result = json.load(sys.stdin); assert 'mnemos-cli-smoke-marker' in json.dumps(result), result"
          mnemos --db "$DB_PATH" doctor
