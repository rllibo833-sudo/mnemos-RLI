[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-rli"
version = "0.2.0"
description = "Offline system integrity evidence, artifact comparison, and reconstruction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mnemos contributors" }]
keywords = ["integrity", "diagnostics", "artifact-analysis", "offline", "reconstruction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
macos-events = ["watchdog>=4.0", "pyobjc-framework-CoreServices>=10.0"]
windows-events = ["watchdog>=4.0"]

[project.scripts]
mnemos = "mnemos.cli:main"
mnemos-mcp = "mnemos.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
