<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password Mnemos</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(92vw, 420px); box-sizing: border-box; padding: 28px; border: 1px solid #8886; border-radius: 16px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 14px 0 6px; }
    input, button { box-sizing: border-box; width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #8888; font: inherit; }
    button { margin-top: 18px; cursor: pointer; }
    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Atur ulang password Mnemos</h1>
    <p id="status" role="status">Memeriksa tautan pemulihan…</p>
    <form id="form" hidden>
      <label for="password">Password baru</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">Ulangi password baru</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submit" type="submit">Simpan password baru</button>
    </form>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://kuditcnmasfjgzmimnlc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_g73Xe5kQC19cR1nNXVtRWA_WzkRM-kI";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const status = document.querySelector("#status");
    const form = document.querySelector("#form");
    const submit = document.querySelector("#submit");

    try {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      if (query.get("error_description") || hash.get("error_description")) {
        throw new Error((query.get("error_description") || hash.get("error_description")).replace(/\+/g, " "));
      }
      // Supabase recovery links normally contain access_token + type=recovery in the URL hash.
      // Supabase JS consumes the callback and establishes the recovery session.
      const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" || (session && hash.get("type") === "recovery")) {
          status.textContent = "Tautan valid. Masukkan password baru (minimal 8 karakter).";
          form.hidden = false;
        }
      });
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (data.session && (hash.get("type") === "recovery" || hash.has("access_token"))) {
        status.textContent = "Tautan valid. Masukkan password baru (minimal 8 karakter).";
        form.hidden = false;
      } else if (!hash.has("access_token")) {
        status.textContent = "Buka halaman ini melalui tautan reset password yang dikirim ke email Anda.";
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#password").value;
        const confirm = document.querySelector("#confirm").value;
        if (password.length < 8) { status.textContent = "Password minimal 8 karakter."; return; }
        if (password !== confirm) { status.textContent = "Kedua password tidak sama."; return; }
        submit.disabled = true;
        status.textContent = "Menyimpan password baru…";
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) throw error;
          await supabase.auth.signOut();
          form.hidden = true;
          status.textContent = "Password berhasil diperbarui. Kembali ke terminal dan jalankan node cloud-smoke-test.mjs untuk login dengan password baru.";
          history.replaceState(null, "", location.pathname);
        } catch (error) {
          status.textContent = "Gagal memperbarui password: " + (error?.message || "kesalahan tidak diketahui");
        } finally {
          submit.disabled = false;
        }
      });
      window.addEventListener("pagehide", () => subscription.unsubscribe(), { once: true });
    } catch (error) {
      status.textContent = "Tautan reset tidak valid atau kedaluwarsa: " + (error?.message || "silakan minta tautan baru");
    }
  </script>
</body>
</html>
