name: Java research engine checks

on:
  pull_request:
    paths:
      - "beyond-light-source/beyond-light/src/**"
      - "beyond-light-source/beyond-light/build.gradle"
      - "beyond-light-source/beyond-light/check.sh"
      - ".github/workflows/java-research-core.yml"
  push:
    branches: [main]
    paths:
      - "beyond-light-source/beyond-light/src/**"
      - "beyond-light-source/beyond-light/build.gradle"
      - "beyond-light-source/beyond-light/check.sh"
      - ".github/workflows/java-research-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-research-core
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Java regression suites
        working-directory: beyond-light-source/beyond-light
        run: gradle --no-daemon verifyCore verifyIntegrationCore
